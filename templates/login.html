<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - LARP HUB</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>\

 <header class="top-header">
        <div class="top-bar">
    <div class ="logo">
    <img src="../static/o.png" alt="LARP Hub Logo" class="logo-img">
    </div>
<div class="top-links">
    {% if session['username'] %}
        <span style="color: white; font-weight: bold; margin-right: 15px;">
            Hola, {{ session['username'] }}
        </span>
        <a href="/logout" style="color: #ff4c4c;">Cerrar Sesión</a>
    {% else %}
        <a href="/login">Iniciar Sesión</a>
        <a href="/register">Registrarse</a>
    {% endif %}
</div>
</div>

<nav class="main-nav">
    <ul>
        <li><a href="/" class="active">Inicio</a></li>
        <li><a href="/browse">Explorar</a></li>
        <li><a href="/messages">Mensajes</a></li>
        <li><a href="/blog">Blogs</a></li>
        <li><a href="/forum">Foros</a></li>
        <li><a href="/groups">Grupos</a></li>
    </ul>
</nav>

    <main class="container">
        <h2>Iniciar Sesión</h2>
        <form class="auth-form" action="#" method="POST">
            <div class="form-group">
                <label for="username">Usuario o Correo:</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn-submit">Entrar</button>
        </form>
    </main>
</body>
</html>
